<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <style>
        * { font-family: 'Inter', sans-serif; }
        #top-strip { background-color: #003087; }
        #main-header { background: #fff; border-bottom: 3px solid #005EB8; }

        .nav-link {
            position: relative; font-weight: 600; font-size: 0.875rem;
            color: #374151; padding-bottom: 2px; transition: color 0.2s; text-decoration: none;
        }
        .nav-link::after {
            content: ''; position: absolute; bottom: -2px; left: 0; right: 0;
            height: 2px; background-color: #005EB8;
            transform: scaleX(0); transform-origin: left; transition: transform 0.2s ease;
        }
        .nav-link:hover { color: #005EB8; }
        .nav-link:hover::after { transform: scaleX(1); }

        .nav-cta {
            background: #005EB8; color: #fff !important; padding: 0.4rem 1rem;
            border-radius: 9999px; font-size: 0.85rem; font-weight: 700;
            text-decoration: none; transition: background 0.2s, transform 0.1s; white-space: nowrap;
        }
        .nav-cta:hover { background: #003087; transform: scale(1.04); }
        .nav-cta::after { display: none !important; }

        #more-menu { min-width: 210px; border-top: 3px solid #005EB8; animation: dropIn 0.15s ease-out; }
        @keyframes dropIn { from { opacity:0; transform:translateY(-5px); } to { opacity:1; transform:translateY(0); } }

        .dropdown-item {
            display: flex; align-items: center; gap: 0.6rem;
            padding: 0.55rem 1rem; font-size: 0.875rem; font-weight: 500;
            color: #374151; text-decoration: none; transition: background 0.15s, color 0.15s;
        }
        .dropdown-item:hover { background: #EFF6FF; color: #005EB8; }
        .dropdown-item svg { opacity: 0.55; flex-shrink: 0; }

        #mobile-menu {
            background: #fff; border-top: 3px solid #005EB8;
            max-height: 0; overflow: hidden; transition: max-height 0.3s ease;
        }
        #mobile-menu.open { max-height: 600px; }

        .mobile-link {
            display: flex; align-items: center; gap: 0.65rem;
            padding: 0.7rem 1.25rem; font-size: 0.9rem; font-weight: 600;
            color: #374151; text-decoration: none; border-bottom: 1px solid #F3F4F6;
            transition: background 0.15s, color 0.15s;
        }
        .mobile-link:hover { background: #EFF6FF; color: #005EB8; }
        .mobile-link svg { opacity: 0.55; flex-shrink: 0; }
        .mobile-link.highlight { color: #005EB8; }

        .hbar { display: block; width: 22px; height: 2px; background: #374151; border-radius: 2px; transition: transform 0.25s, opacity 0.25s; }
        #mobile-menu-button.open .hbar-1 { transform: rotate(45deg) translate(3px,3px); }
        #mobile-menu-button.open .hbar-2 { opacity: 0; }
        #mobile-menu-button.open .hbar-3 { transform: rotate(-45deg) translate(3px,-3px); }
    </style>
</head>
<body>
    <div id="top-strip" class="hidden md:block text-white text-xs text-center py-1.5 font-medium tracking-wide">
        NUH Clinical Pathology Shared Governance &nbsp;&middot;&nbsp; Created by staff, for staff
    </div>

    <header id="main-header" class="sticky top-0 z-50">
        <div class="container mx-auto px-5 py-3 flex justify-between items-center">
            <a href="index.html" class="flex-shrink-0 group">
                <img src="logo.jpg" alt="Clinical Pathology Shared Governance Council"
                     class="h-16 md:h-20 w-auto transition-opacity group-hover:opacity-85">
            </a>

            <nav class="hidden lg:flex items-center gap-7">
                <a href="index.html"       class="nav-link">Home</a>
                <a href="projects.html"    class="nav-link">Projects</a>
                <a href="video_tours.html" class="nav-link">Lab Tours</a>
                <a href="games.html"       class="nav-cta">&#127918; Games</a>
                <div class="relative" id="more-wrapper">
                    <button id="more-menu-button" class="nav-link flex items-center gap-1 cursor-pointer bg-transparent border-0 p-0" style="font-family:inherit;" aria-haspopup="true" aria-expanded="false">
                        More <i data-feather="chevron-down" class="w-3.5 h-3.5 transition-transform duration-200" id="more-chevron"></i>
                    </button>
                    <div id="more-menu" class="absolute right-0 mt-3 hidden bg-white rounded-lg shadow-xl ring-1 ring-black/5 overflow-hidden z-50">
                        <a href="helpful_tools.html" class="dropdown-item"><i data-feather="tool"></i> Helpful Tools</a>
                        <a href="links.html"         class="dropdown-item"><i data-feather="book-open"></i> Learning Links</a>
                        <a href="newsletters.html"   class="dropdown-item"><i data-feather="mail"></i> Newsletters</a>
                        <a href="about.html"         class="dropdown-item"><i data-feather="users"></i> About Us</a>
                        <a href="social.html"        class="dropdown-item"><i data-feather="share-2"></i> Social Media</a>
                        <a href="contact.html"       class="dropdown-item"><i data-feather="send"></i> Suggestions</a>
                    </div>
                </div>
            </nav>

            <button id="mobile-menu-button" class="lg:hidden flex flex-col gap-1.5 p-2 rounded focus:outline-none" aria-label="Toggle navigation">
                <span class="hbar hbar-1"></span>
                <span class="hbar hbar-2"></span>
                <span class="hbar hbar-3"></span>
            </button>
        </div>

        <div id="mobile-menu">
            <a href="index.html"         class="mobile-link"><i data-feather="home"></i> Home</a>
            <a href="projects.html"      class="mobile-link"><i data-feather="lightbulb"></i> Projects</a>
            <a href="video_tours.html"   class="mobile-link"><i data-feather="video"></i> Lab Tours</a>
            <a href="games.html"         class="mobile-link highlight"><i data-feather="award"></i> Games</a>
            <a href="helpful_tools.html" class="mobile-link"><i data-feather="tool"></i> Helpful Tools</a>
            <a href="links.html"         class="mobile-link"><i data-feather="book-open"></i> Learning Links</a>
            <a href="newsletters.html"   class="mobile-link"><i data-feather="mail"></i> Newsletters</a>
            <a href="about.html"         class="mobile-link"><i data-feather="users"></i> About Us</a>
            <a href="social.html"        class="mobile-link"><i data-feather="share-2"></i> Social Media</a>
            <a href="contact.html"       class="mobile-link"><i data-feather="send"></i> Suggestions</a>
        </div>
    </header>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof feather !== 'undefined') feather.replace();
            const mobileBtn  = document.getElementById('mobile-menu-button');
            const mobileMenu = document.getElementById('mobile-menu');
            mobileBtn.addEventListener('click', () => {
                const open = mobileMenu.classList.toggle('open');
                mobileBtn.classList.toggle('open', open);
            });
            const moreBtn     = document.getElementById('more-menu-button');
            const moreMenu    = document.getElementById('more-menu');
            const moreChevron = document.getElementById('more-chevron');
            const moreWrapper = document.getElementById('more-wrapper');
            moreBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                const hidden = moreMenu.classList.toggle('hidden');
                moreChevron.style.transform = hidden ? '' : 'rotate(180deg)';
                moreBtn.setAttribute('aria-expanded', String(!hidden));
            });
            document.addEventListener('click', (e) => {
                if (!moreWrapper.contains(e.target)) {
                    moreMenu.classList.add('hidden');
                    moreChevron.style.transform = '';
                }
            });
        });
    </script>
</body>
</html>
